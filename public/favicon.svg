<!-- prompt: content of the favicon must be "IS" I = white, S = golden #887b2a -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- dark brand background so white I stays readable -->
  <rect width="128" height="128" fill="#0e0e0e"/>
  <!-- Georgia serif matches site headlines; two tspans split I/S colors -->
  <text
    x="64"
    y="90"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-weight="700"
    font-size="78"
    letter-spacing="-2"
  >
    <tspan fill="#ffffff">I</tspan><tspan fill="#887b2a">S</tspan>
  </text>
</svg>
